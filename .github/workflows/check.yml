name: Validate blueprint

on:
  pull_request:
    paths:
      - "src/**"
      - "build/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline validation
        run: python build/build.py --check
      - name: Full build
        run: python build/build.py
